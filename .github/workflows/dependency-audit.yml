name: Dependency Security Audit

# Runs on:
#   - Every PR (catches bad deps before merge)
#   - Every push to main (catches anything that slipped through)
#   - Daily at 07:00 UTC (catches newly disclosed vulnerabilities)
#   - Manual trigger (for ad-hoc checks)

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'

jobs:
  # ────────────────────────────────────────────────────────────
  # npm: blocklist + npm audit
  # ────────────────────────────────────────────────────────────
  npm-audit:
    name: 'npm — Blocklist & Audit'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm dependency audit
        run: ./scripts/audit-dependencies.sh --npm-only --severity high --fail-severity critical

  # ────────────────────────────────────────────────────────────
  # NuGet: blocklist + dotnet list --vulnerable
  # ────────────────────────────────────────────────────────────
  nuget-audit:
    name: 'NuGet — Blocklist & Vulnerable'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore packages
        run: dotnet restore Oluso.sln

      - name: Run NuGet dependency audit
        run: ./scripts/audit-dependencies.sh --nuget-only

  # ────────────────────────────────────────────────────────────
  # Lockfile integrity — detect tampering
  # ────────────────────────────────────────────────────────────
  lockfile-integrity:
    name: 'Lockfile Integrity Check'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify src/frontend lockfile
        working-directory: src/frontend
        run: |
          npm ci --ignore-scripts 2>&1 || {
            echo "::error::package-lock.json is out of sync with package.json in src/frontend"
            exit 1
          }

  # ────────────────────────────────────────────────────────────
  # New dependency review — flag net-new risky deps in PRs
  # ────────────────────────────────────────────────────────────
  dependency-review:
    name: 'Dependency Review (PR only)'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-packages: 'pkg:npm/plain-crypto-js'
