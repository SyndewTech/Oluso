<div class="overflow-hidden">
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        @for (column of columns(); track column.key) {
          <th
            scope="col"
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            {{ column.header }}
          </th>
        }
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      @if (loading()) {
        <tr>
          <td [attr.colspan]="columns().length" class="px-6 py-12 text-center">
            <div class="flex justify-center">
              <svg
                class="animate-spin h-8 w-8 text-primary-600"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
            </div>
          </td>
        </tr>
      } @else if (data().length === 0) {
        <tr>
          <td [attr.colspan]="columns().length" class="px-6 py-12 text-center text-sm text-gray-500">
            {{ emptyMessage() }}
          </td>
        </tr>
      } @else {
        @for (item of data(); track trackByIndex($index)) {
          <tr
            [class.cursor-pointer]="clickable()"
            [class.hover:bg-gray-50]="clickable()"
            (click)="onRowClick(item)"
          >
            @for (column of columns(); track column.key) {
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                <ng-container *ngIf="cellTemplate; else defaultCell">
                  <ng-container
                    *ngTemplateOutlet="cellTemplate; context: { $implicit: item, column: column }"
                  ></ng-container>
                </ng-container>
                <ng-template #defaultCell>
                  {{ getColumnValue(item, column) }}
                </ng-template>
              </td>
            }
          </tr>
        }
      }
    </tbody>
  </table>
</div>
