<div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
  <!-- Search bar -->
  @if (searchable()) {
    <div class="px-4 py-3 border-b border-gray-200 bg-gray-50">
      <div class="flex items-center gap-2">
        <div class="relative flex-1">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <ui-icon name="search" class="h-4 w-4 text-gray-400" />
          </div>
          <input
            type="text"
            [value]="searchTerm()"
            (input)="onSearchInput($event)"
            (keydown)="onSearchKeydown($event)"
            [placeholder]="searchPlaceholder()"
            class="block w-full pl-10 pr-8 py-2 text-sm border border-gray-300 rounded-md focus:ring-primary-500 focus:border-primary-500"
          />
          @if (searchTerm()) {
            <button
              (click)="onClearSearch()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"
            >
              <ui-icon name="x-mark" class="h-4 w-4" />
            </button>
          }
        </div>
        <button
          (click)="onSearchSubmit()"
          class="inline-flex items-center px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 focus:ring-2 focus:ring-primary-500"
        >
          Search
        </button>
      </div>
    </div>
  }

  <!-- Loading state -->
  @if (loading()) {
    <div class="flex items-center justify-center h-64">
      <div class="flex flex-col items-center gap-3">
        <svg
          class="animate-spin h-8 w-8 text-primary-600"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
        <span class="text-sm text-gray-500">Loading...</span>
      </div>
    </div>
  } @else if (empty()) {
    <!-- Empty state -->
    <div class="flex flex-col items-center justify-center h-64 text-gray-500">
      <ui-icon name="inbox" class="h-12 w-12 mb-4" />
      <p>{{ emptyMessage() }}</p>
      @if (searchTerm()) {
        <button
          (click)="onClearSearch()"
          class="mt-2 text-sm text-primary-600 hover:text-primary-700"
        >
          Clear search
        </button>
      }
    </div>
  } @else {
    <!-- Table content (projected) -->
    <div class="overflow-x-auto">
      <ng-content></ng-content>
    </div>
  }

  <!-- Pagination footer — delegated to the canonical <ui-pagination>
       primitive so every list / table in the platform gets the same
       chrome (range label, page-size selector, prev/next). -->
  @if (paginated() && !loading()) {
    <ui-pagination
      [page]="page()"
      [pageSize]="pageSize()"
      [totalCount]="totalCount()"
      [totalPages]="totalPages()"
      [pageSizeOptions]="pageSizeOptions()"
      [showPageSize]="showPageSize()"
      (pageChange)="pageChange.emit($event)"
      (pageSizeChange)="pageSizeChange.emit($event)"
    />
  }
</div>
